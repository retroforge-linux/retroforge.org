[project]
site_name = "RetroForge"
site_url = "https://retroforge.org"
site_description = "A lightweight Linux distribution built for retro emulation on Qualcomm Snapdragon handhelds."
site_author = "RetroForge Linux"
copyright = "Copyright &copy; 2026 RetroForge Linux"

repo_url = "https://github.com/retroforge-linux/os-build"
repo_name = "retroforge-linux/os-build"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    "guide/index.md",
    "guide/requirements.md",
    "guide/installation.md",
    "guide/emulators.md",
    "guide/hotkeys.md",
    "guide/updates.md",
    "guide/faq.md",
  ] },
  { "Devices" = "devices/index.md" },
  { "Developers" = [
    "developers/index.md",
    "developers/building.md",
    "developers/adding-a-board.md",
  ] },
  { "Community" = "community.md" },
  { "About" = "about.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Plus Jakarta Sans"
code = "JetBrains Mono"

# Dark (slate) first: the brand is a dark one. Light is offered as a toggle.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/retroforge-linux"
name = "RetroForge on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/ZfgXY3W2F9"
name = "RetroForge on Discord"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
